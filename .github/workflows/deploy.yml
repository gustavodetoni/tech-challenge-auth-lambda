name: Deploy

on:
  push:
    branches:
      - homolog
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Package
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/bootstrap ./cmd/auth
          cd dist
          zip function.zip bootstrap

      - name: Deploy placeholder
        run: echo "Configure AWS credentials and lambda update-function-code here."

